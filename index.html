<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wallpaper Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DynaPuff:wght@500;600;700&display=swap" rel="stylesheet">
    <link id="dynamic-font" href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Full-Screen Character Wallpaper Layer (behind everything) -->
    <div id="character-wallpaper" class="mode-center">
        <img id="character-wallpaper-img" src="" alt="Wallpaper">
        <div id="character-wallpaper-overlay"></div>
    </div>

    <!-- Drag & Drop Overlay (Visible when dragging an image from desktop) -->
    <div id="drag-drop-overlay">
        <div class="drop-modal">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <h3>Drop your wallpaper here</h3>
            <p>Supports PNG, JPG, WebP, GIF</p>
        </div>
    </div>

    <div class="dashboard-container">
        
        <!-- System Widget (Alarm & Battery) -->
        <div class="widget drag-widget" style="top: 50px; left: 50px; width: 150px; height: 90px; border-radius: 18px;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div class="widget-row">
                <div class="small-widget interactive-btn" id="alarm-widget" title="Set alarm">
                    <i class="fa-solid fa-bell"></i>
                    <span id="alarm-time" style="font-size: 0.9rem;">off</span>
                </div>
                <div class="small-widget" id="battery-widget">
                    <i class="fa-solid fa-battery-three-quarters" id="battery-icon"></i>
                    <span id="battery-level" style="font-size: 0.9rem;">62%</span>
                </div>
            </div>
        </div>

        <!-- Integrated Weather & Humidity Widget -->
        <div class="widget drag-widget weather-widget" style="top: 160px; left: 50px; width: 150px; height: 160px; border-radius: 18px;" id="weather-container">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div class="weather-header" style="align-items: flex-start;">
                <div class="weather-temp" id="weather-temp" style="font-size: 2.5rem; line-height: 1;">35&deg;</div>
                <div class="weather-emoji" id="weather-emoji" style="font-size: 2rem;">⛅</div>
            </div>
            <div class="weather-desc" id="weather-desc" style="font-size: 0.8rem; margin-top: 5px;">Partly Cloudy</div>
            <div class="weather-details" style="font-size: 0.75rem; color: #add8e6; margin-top: 0px;">
                <span><i class="fa-solid fa-droplet"></i> <span id="humidity-level">66%</span></span>
            </div>
            <div class="weather-loc" id="weather-loc" style="font-size: 0.8rem; padding-top: 8px; border: none; font-weight: 600;">Lahore</div>
        </div>

        <!-- Calendar Widget -->
        <div class="widget drag-widget calendar-widget" style="top: 340px; left: 50px; width: 170px; height: 170px; border-radius: 18px;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div class="calendar-header" id="calendar-month" style="font-size: 0.85rem; font-weight: 700;">SEP</div>
            <div class="calendar-grid-header" style="font-size: 0.7rem;">
                <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
            </div>
            <div class="calendar-grid" id="calendar-grid" style="font-size: 0.7rem;"></div>
        </div>

        <!-- Reminders / Todo Widget -->
        <div class="widget drag-widget todo-widget" style="top: 530px; left: 50px; width: 170px; height: 160px; border-radius: 18px; position: relative;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div id="todo-list-container"></div>
            <div class="add-todo-container" style="position: absolute; bottom: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 6px 12px;">
                <input type="text" id="todo-input" placeholder="Type a reminder..." style="font-size: 0.8rem; text-align: left;">
            </div>
        </div>

        <!-- Date Widget -->
        <div class="drag-widget date-container" style="top: 50px; right: 50px; width: 450px; text-align: right;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div class="date-display" id="date-display" style="font-size: 3rem;">Fri, September 11</div>
        </div>

        <!-- Time Widget -->
        <div class="drag-widget time-container" style="top: 105px; right: 50px; width: 450px; text-align: right;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            <div class="time-display" style="justify-content: flex-end; align-items: flex-end;">
                <span id="time-display" style="font-size: 4.5rem;">6:46</span>
                <span id="ampm-display" style="font-size: 1.5rem; margin-bottom: 12px; margin-left: 5px;">PM</span>
            </div>
        </div>

        <!-- Aesthetic Theme & Wallpaper Control Panel -->
        <div class="theme-panel drag-widget" style="bottom: 40px; right: 40px; width: 340px;">
            <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
            
            <div class="panel-header">
                <i class="fa-solid fa-palette"></i>
                <span>THEME & WALLPAPER</span>
            </div>

            <!-- Upload & Image Actions -->
            <div class="panel-row">
                <label class="panel-btn upload-btn" title="Choose an image file from your PC">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Upload Image</span>
                    <input type="file" id="wallpaper-file-input" accept="image/*" style="display:none;">
                </label>
                <button class="panel-btn icon-btn" id="toggle-fit-btn" title="Switch between Center Character Art and Full Screen Cover">
                    <i class="fa-solid fa-expand"></i>
                    <span id="fit-label">Cover</span>
                </button>
                <button class="panel-btn icon-btn danger-btn" id="clear-wallpaper-btn" title="Clear image">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <!-- Quick Character Palette Presets -->
            <div class="palette-chips-container">
                <button class="palette-chip active" data-char="buttercup" title="Buttercup (Emerald & Lime)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #2D5A46, #A5C271);"></span>
                    Buttercup
                </button>
                <button class="palette-chip" data-char="blossom" title="Blossom (Rose & Coral)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #D87093, #FF7F50);"></span>
                    Blossom
                </button>
                <button class="palette-chip" data-char="bubbles" title="Bubbles (Ocean & Gold)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #4682B4, #FFD700);"></span>
                    Bubbles
                </button>
                <button class="palette-chip" data-char="snow white" title="Snow White (Royal Blue & Amber)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #2B3A67, #FFD166);"></span>
                    Snow White
                </button>
                <button class="palette-chip" data-char="tweety" title="Tweety (Canary Yellow & Sky)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #E6AF2E, #4FC3F7);"></span>
                    Tweety
                </button>
                <button class="palette-chip" data-char="annabelle" title="Annabelle (Gothic Crimson & Noir)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #2D0A0A, #C44545);"></span>
                    Annabelle
                </button>
                <button class="palette-chip" data-char="midnight" title="Midnight Noir (Dark Velvet & Silver)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #11141A, #3A3F4D);"></span>
                    Midnight
                </button>
                <button class="palette-chip" data-char="cyberpunk" title="Cyberpunk (Deep Purple & Neon Cyan)">
                    <span class="chip-color" style="background: linear-gradient(135deg, #4A148C, #00E5FF);"></span>
                    Cyber
                </button>
            </div>

            <!-- Custom Color Pickers -->
            <div class="custom-colors-row">
                <label title="Gradient Start Color">
                    <span>Color 1</span>
                    <input type="color" id="bg-color-1-picker" value="#2D5A46">
                </label>
                <label title="Gradient End Color">
                    <span>Color 2</span>
                    <input type="color" id="bg-color-2-picker" value="#509F8C">
                </label>
                <div class="search-wrap">
                    <input type="text" id="theme-input" placeholder="Type character...">
                    <button id="apply-theme-name-btn" title="Apply name palette"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="drop-hint">💡 Tip: Drag & drop any image onto the screen</div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
