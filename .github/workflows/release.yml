# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag must match "version" in package.json. Installed copies of the app update themselves
# from these releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed to create the release and upload the installer

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      # Google sign-in credentials are kept in a repository secret, not in the code.
      # Without them the app can't sign in to Google, so don't publish anything.
      - name: Add Google sign-in credentials
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -z "$GOOGLE_OAUTH_JSON" ]; then
            echo "::error::The GOOGLE_OAUTH_JSON repository secret is missing, so this build would have no Google sign-in. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_JSON" > src/main/google-oauth.json
          node -e "const c=require('./src/main/google-oauth.json'); if(!(c.installed||c).client_id) { console.error('::error::GOOGLE_OAUTH_JSON is not a valid Google OAuth client file'); process.exit(1); }"

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
