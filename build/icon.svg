<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2e24"/>
      <stop offset="0.55" stop-color="#1d6a4d"/>
      <stop offset="1" stop-color="#5fbf8c"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9ffb5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e9ffb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ffd6"/>
      <stop offset="1" stop-color="#b6ec6e"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="262" r="150" fill="url(#sunglow)"/>
    <circle cx="256" cy="262" r="86" fill="url(#sun)"/>
    <path d="M0 330 C 90 290, 160 300, 256 336 S 420 380, 512 320 V512 H0 Z" fill="#2f8a62"/>
    <path d="M0 390 C 110 350, 200 360, 290 392 S 440 420, 512 380 V512 H0 Z" fill="#1c5e44"/>
    <path d="M0 446 C 120 416, 250 426, 340 450 S 470 470, 512 448 V512 H0 Z" fill="#0d3a2b"/>
    <!-- a glass widget floating in the sky -->
    <rect x="74" y="74" width="150" height="104" rx="30" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
    <rect x="100" y="104" width="70" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="100" y="134" width="98" height="14" rx="7" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
